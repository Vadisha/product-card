<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Async Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="async.css">
</head>
<body>
  <div class="container">
    <div id="status-message" class="status-message status-loading">
      Данные загружаются
    </div>

    <div id="controls" class="controls">
      <button id="delete-all-btn" class="btn btn-danger">Удалить все карточки</button>
      <button id="get-all-btn" class="btn btn-primary">Получить все карточки</button>
    </div>

    <div id="cards-container" class="cards-container"></div>
  </div>

  <template id="user-card-template">
    <div class="user-card">
      <div class="card-header">
        <h3 class="card-name">Без имени</h3>
        <button class="delete-card-btn">×</button>
      </div>
      <div class="card-body">
        <p><strong>Email:</strong> <span class="card-email">Не указан</span></p>
        <p><strong>Телефон:</strong> <span class="card-phone">Не указан</span></p>
        <p class="card-address" style="display: none;"><strong>Адрес:</strong> <span class="card-address-text"></span></p>
        <p class="card-company" style="display: none;"><strong>Компания:</strong> <span class="card-company-text"></span></p>
      </div>
    </div>
  </template>

  <script src="async.js"></script>
</body>
</html>
