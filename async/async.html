<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Async Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="async.css">
</head>
<body>
  <div class="container">
    <div id="loader" class="status-message status-loading"></div>

    <button id="cards-btn" class="btn btn-primary">Загрузить карточки</button>

    <div class="buttons" style="display: none;">
      <button id="get-cards" class="btn btn-primary" style="display: none;">Получить все карточки</button>
      <button id="delete-all-cards" class="btn btn-danger">Удалить все карточки</button>
      <button id="delete-card" class="btn btn-danger">Удалить первую карточку</button>
    </div>

    <div id="user-cards" class="cards-container"></div>
  </div>

  <template id="user-template">
    <div class="user-card">
      <div class="card-header">
        <p class="id"></p>
        <p class="name"></p>
        <p class="surname"></p>
        <p class="email"></p>
        <p class="age"></p>
        <p class="height"></p>
      </div>
    </div>
  </template>

  <script src="async.js"></script>
</body>
</html>
